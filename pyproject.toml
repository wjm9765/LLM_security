[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-collapse-analysis"
version = "0.1.0"
description = "Activation vector analysis on Multimodal LLMs for safety collapse."
requires-python = ">=3.9"
dependencies = [
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "transformers",
    "accelerate>=0.26.0",
    "bitsandbytes>=0.46.1",
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "soundfile",
    "librosa",
    "pyyaml",
    "gtts"
]
