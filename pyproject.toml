[project]
name = "multimodal-jailbreak-pipeline"
version = "0.1.0"
description = "Multimodal (Text vs Audio) LLM Jailbreak experiment pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "torchaudio>=2.4.0",
    "transformers>=4.35.0",
    "accelerate>=0.21.0",
    "bitsandbytes>=0.41.0",
    "datasets>=2.14.0",
    "edge-tts>=6.1.9",
    "librosa>=0.10.0",
    "soundfile>=0.12.1",
    "tqdm>=4.66.1",
    "scipy>=1.11.0"
]

[tool.uv]
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
